    <script>
        // URL Google Apps Script Web App
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzv4TuqJ0rWAv-GorfLYp-V40Img_0GzV_yga_OMgUnWpDMMxEgvU_sFHm0uJYN6aCz/exec";

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        const initialSppData = [
            { id: 1, no: "SPP/007/LOG/2026", tgl: "2026-09-04", pengaju: "Pembesian", barang: "Kawat Bendrat", spek: "@20Kg", qty: 50, satuan: "Roll", realisasiHistory: [], totalRealisasi: 0, ket: "Urgent untuk balok lantai 2" },
            { id: 2, no: "SPP/001/LOG/2026", tgl: "2026-09-02", pengaju: "Tim Cor", barang: "Kawat Ayam", spek: "1/2", qty: 50, satuan: "Roll", realisasiHistory: [], totalRealisasi: 0, ket: "Stop Cor" },
            { id: 3, no: "SPP/002/LOG/2026", tgl: "2026-09-01", pengaju: "Bengkel Proyek", barang: "Kawat Las", spek: "RB260-2,6mm", qty: 100, satuan: "Kg", realisasiHistory: [{tgl: "2026-09-02", qty: 50}, {tgl: "2026-09-03", qty: 50}], totalRealisasi: 100, ket: "Pengelasan struktur baja" },
            { id: 4, no: "SPP/003/LOG/2026", tgl: "2026-08-10", pengaju: "Pengecoran", barang: "Semen Portland", spek: "Tiga Roda 50Kg", qty: 500, satuan: "Zak", realisasiHistory: [{tgl: "2026-08-12", qty: 200}, {tgl: "2026-08-15", qty: 150}], totalRealisasi: 350, ket: "Pengecoran Slab Lt 1" }
        ];

        const initialMasukData = [
            { id: 1, tgl: "2026-09-01", vendor: "Azidar H Berni", barang: "Kawat Bendrat", spek: "@20Kg", qty: 10, satuan: "Roll", harga: 475000, total: 4750000, ket: "PO 430011567" },
            { id: 2, tgl: "2026-09-01", vendor: "Azidar H Berni", barang: "Kawat Las RD460", spek: "RD460-2,6mm", qty: 5, satuan: "Kg", harga: 75000, total: 375000, ket: "PO 430011456" },
            { id: 3, tgl: "2026-09-04", vendor: "PT. Agung Teknik Mandiri", barang: "Kayu Balok", spek: "20/20x4m", qty: 2, satuan: "M3", harga: 770000, total: 1540000, ket: "PO 430011789" },
            { id: 4, tgl: "2026-09-06", vendor: "PT. Kuali Mas", barang: "Kawat Licin", spek: "1,9mm", qty: 10, satuan: "Roll", harga: 1500000, total: 15000000, ket: "-" },
            { id: 5, tgl: "2026-09-06", vendor: "PT. Kuali Mas", barang: "Kawat Bendrat", spek: "@20Kg", qty: 10, satuan: "Roll", harga: 475000, total: 4750000, ket: "-" },
            { id: 6, tgl: "2026-09-06", vendor: "PT. Kuali Mas", barang: "Semen Conch", spek: "@50Kg", qty: 100, satuan: "Zak", harga: 110000, total: 11000000, ket: "-" }
        ];

        const initialKeluarData = [
            { id: 1, tgl: "2026-09-04", pengambil: "Pekerja Precast", barang: "Kawat Las", spek: "RB260-2,6mm", qty: 10, satuan: "Kg", ket: "Precast", petugas: "Staff Logistik" },
            { id: 2, tgl: "2026-09-04", pengambil: "Mandor Dermaga", barang: "Besi Beton 12mm", spek: "Polos SNI 12m", qty: 10, satuan: "Batang", ket: "Jetty", petugas: "Staff Logistik" }
        ];

        let sppData = JSON.parse(localStorage.getItem('sppData')) || initialSppData;
        let masukData = JSON.parse(localStorage.getItem('masukData')) || initialMasukData;
        let keluarData = JSON.parse(localStorage.getItem('keluarData')) || initialKeluarData;
        let isGroupedMasukView = false;

        function syncDataToServer() {
            const payload = { sppData, masukData, keluarData };
            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => console.error("Sync error:", err));
        }

        function loadDataFromServer() {
            fetch(WEB_APP_URL)
                .then(res => res.json())
                .then(data => {
                    if(data && data.sppData) {
                        sppData = data.sppData;
                        masukData = data.masukData || masukData;
                        keluarData = data.keluarData || keluarData;
                        localStorage.setItem('sppData', JSON.stringify(sppData));
                        localStorage.setItem('masukData', JSON.stringify(masukData));
                        localStorage.setItem('keluarData', JSON.stringify(keluarData));
                        renderAll();
                    }
                })
                .catch(err => console.log("Menggunakan data lokal cache:", err));
        }

        function saveData() {
            localStorage.setItem('sppData', JSON.stringify(sppData));
            localStorage.setItem('masukData', JSON.stringify(masukData));
            localStorage.setItem('keluarData', JSON.stringify(keluarData));
            renderAll();
            syncDataToServer();
        }

        function resetDemoData() {
            if(confirm('Reset data kembali ke data demo awal?')) {
                localStorage.clear();
                sppData = [...initialSppData];
                masukData = [...initialMasukData];
                keluarData = [...initialKeluarData];
                saveData();
            }
        }

        function exportDataJSON() {
            const dataToExport = {
                app: "LogistikPro",
                version: "1.0",
                exportDate: new Date().toISOString(),
                sppData, masukData, keluarData
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataToExport, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            const dateStr = new Date().toISOString().split('T')[0];
            downloadAnchor.setAttribute("download", `LogistikPro_Backup_${dateStr}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importDataJSON(event) {
            const fileReader = new FileReader();
            if (event.target.files && event.target.files[0]) {
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (parsed.sppData && parsed.masukData && parsed.keluarData) {
                            if(confirm("Impor data akan menggantikan data saat ini. Lanjutkan?")) {
                                sppData = parsed.sppData;
                                masukData = parsed.masukData;
                                keluarData = parsed.keluarData;
                                saveData();
                                alert("Data berhasil diimpor!");
                            }
                        } else {
                            alert("Format file JSON tidak valid untuk aplikasi LogistikPro.");
                        }
                    } catch (error) {
                        alert("Gagal membaca file JSON: " + error.message);
                    }
                    event.target.value = '';
                };
            }
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => {
                el.classList.remove('sidebar-active');
                el.classList.add('hover:bg-slate-800', 'hover:text-white');
            });

            document.getElementById(`tab-${tabName}`).classList.add('active');
            const activeNav = document.getElementById(`nav-${tabName}`);
            activeNav.classList.add('sidebar-active');
            activeNav.classList.remove('hover:bg-slate-800', 'hover:text-white');

            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                const overlay = document.getElementById('sidebar-overlay');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                    overlay.classList.add('hidden');
                }
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
            document.getElementById(id).classList.remove('flex');
        }

        function toggleMasukView() {
            isGroupedMasukView = !isGroupedMasukView;
            const label = document.getElementById('view-mode-label');
            if(isGroupedMasukView) {
                label.innerText = 'Kembali ke Tampilan Detail Item';
            } else {
                label.innerText = 'Tampilkan Akumulasi per Vendor';
            }
            renderMasukTable();
        }

        function showCardDetail(type) {
            const head = document.getElementById('card-detail-head');
            const body = document.getElementById('card-detail-body');
            const title = document.getElementById('card-detail-title');
            body.innerHTML = '';

            if(type === 'spp') {
                title.innerText = 'Rincian Seluruh Permintaan SPP';
                head.innerHTML = `<tr class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] border-b"><th class="p-2">No SPP</th><th class="p-2">Tgl</th><th class="p-2">Pengaju</th><th class="p-2">Barang</th><th class="p-2 text-center">Qty</th><th class="p-2">Keterangan</th></tr>`;
                sppData.forEach(item => {
                    body.innerHTML += `<tr class="border-b"><td class="p-2 font-bold text-blue-600">${item.no}</td><td class="p-2">${item.tgl}</td><td class="p-2">${item.pengaju}</td><td class="p-2 font-semibold">${item.barang}</td><td class="p-2 text-center">${item.qty} ${item.satuan}</td><td class="p-2">${item.ket || '-'}</td></tr>`;
                });
            } else if(type === 'kurang') {
                title.innerText = 'Rincian Kekurangan Realisasi SPP';
                head.innerHTML = `<tr class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] border-b"><th class="p-2">No SPP</th><th class="p-2">Barang</th><th class="p-2 text-center">Qty Permintaan</th><th class="p-2 text-center">Realisasi</th><th class="p-2 text-center">Kekurangan</th></tr>`;
                sppData.filter(i => (i.qty - i.totalRealisasi) > 0).forEach(item => {
                    const sisa = item.qty - item.totalRealisasi;
                    body.innerHTML += `<tr class="border-b"><td class="p-2 font-bold text-blue-600">${item.no}</td><td class="p-2 font-semibold">${item.barang}</td><td class="p-2 text-center">${item.qty}</td><td class="p-2 text-center text-emerald-600">${item.totalRealisasi}</td><td class="p-2 text-center font-bold text-amber-600">${sisa} ${item.satuan}</td></tr>`;
                });
            } else if(type === 'masuk') {
                title.innerText = 'Rincian Penerimaan Barang Masuk';
                head.innerHTML = `<tr class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] border-b"><th class="p-2">Tgl</th><th class="p-2">Vendor</th><th class="p-2">Barang</th><th class="p-2 text-center">Qty</th><th class="p-2 text-right">Total (Rp)</th><th class="p-2">Keterangan</th></tr>`;
                masukData.forEach(item => {
                    body.innerHTML += `<tr class="border-b"><td class="p-2">${item.tgl}</td><td class="p-2 font-semibold">${item.vendor}</td><td class="p-2">${item.barang}</td><td class="p-2 text-center font-bold">${item.qty} ${item.satuan}</td><td class="p-2 text-right font-bold text-emerald-600">Rp ${item.total.toLocaleString('id-ID')}</td><td class="p-2">${item.ket || '-'}</td></tr>`;
                });
            } else if(type === 'stok') {
                title.innerText = 'Rincian Stok Barang Gudang Saat Ini';
                head.innerHTML = `<tr class="bg-slate-50 text-slate-500 font-bold uppercase text-[10px] border-b"><th class="p-2">Nama Barang</th><th class="p-2">Spek</th><th class="p-2 text-center">Total Masuk</th><th class="p-2 text-center">Total Keluar</th><th class="p-2 text-center">Saldo Akhir</th></tr>`;
                const stokMap = {};
                masukData.forEach(m => { stokMap[m.barang] = stokMap[m.barang] || {spek: m.spek, satuan: m.satuan, masuk: 0, keluar: 0}; stokMap[m.barang].masuk += m.qty; });
                keluarData.forEach(k => { stokMap[k.barang] = stokMap[k.barang] || {spek: k.spek||'-', satuan: k.satuan, masuk: 0, keluar: 0}; stokMap[k.barang].keluar += k.qty; });
                Object.keys(stokMap).forEach(b => {
                    const st = stokMap[b];
                    body.innerHTML += `<tr class="border-b"><td class="p-2 font-bold">${b}</td><td class="p-2">${st.spek}</td><td class="p-2 text-center text-emerald-600">+${st.masuk}</td><td class="p-2 text-center text-rose-500">-${st.keluar}</td><td class="p-2 text-center font-bold text-purple-600">${st.masuk - st.keluar} ${st.satuan}</td></tr>`;
                });
            }

            document.getElementById('modal-card-detail').classList.remove('hidden');
            document.getElementById('modal-card-detail').classList.add('flex');
        }

        function openSppModal(editId = null) {
            document.getElementById('spp-items-container').innerHTML = '';
            document.getElementById('spp-edit-id').value = '';
            
            if(editId) {
                const item = sppData.find(i => i.id === editId);
                document.getElementById('spp-edit-id').value = item.id;
                document.getElementById('spp-no').value = item.no;
                document.getElementById('spp-tgl').value = item.tgl;
                document.getElementById('spp-pengaju').value = item.pengaju;
                document.getElementById('spp-modal-title').innerText = 'Edit Data SPP';
                document.getElementById('btn-add-spp-item').style.display = 'none';

                addSppItemRow(item.barang, item.spek, item.qty, item.satuan, item.ket);
            } else {
                document.getElementById('form-spp').reset();
                document.getElementById('spp-modal-title').innerText = 'Form Permintaan Barang (SPP Baru)';
                document.getElementById('btn-add-spp-item').style.display = 'inline-flex';
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('spp-tgl').value = today;
                addSppItemRow();
            }
            document.getElementById('modal-spp').classList.remove('hidden');
            document.getElementById('modal-spp').classList.add('flex');
        }

        function addSppItemRow(barang="", spek="", qty="", satuan="", ket="") {
            const container = document.getElementById('spp-items-container');
            const row = document.createElement('div');
            row.className = 'grid grid-cols-1 sm:grid-cols-12 gap-2 items-center spp-row bg-white p-2.5 sm:p-2 rounded-lg border border-slate-200';
            row.innerHTML = `
                <div class="sm:col-span-3"><input type="text" value="${barang}" placeholder="Nama Barang" class="w-full p-1.5 border rounded item-nama" required></div>
                <div class="sm:col-span-2"><input type="text" value="${spek}" placeholder="Spesifikasi" class="w-full p-1.5 border rounded item-spek"></div>
                <div class="sm:col-span-2"><input type="number" value="${qty}" placeholder="Qty" class="w-full p-1.5 border rounded item-qty" required></div>
                <div class="sm:col-span-2"><input type="text" value="${satuan}" placeholder="Satuan" class="w-full p-1.5 border rounded item-satuan" required></div>
                <div class="sm:col-span-2"><input type="text" value="${ket}" placeholder="Keterangan SPP" class="w-full p-1.5 border rounded item-ket"></div>
                <div class="sm:col-span-1 text-right sm:text-center"><button type="button" onclick="this.parentElement.parentElement.remove()" class="text-rose-500 p-1"><i class="fa-solid fa-trash"></i> Hapus</button></div>
            `;
            container.appendChild(row);
        }

        function saveSpp(e) {
            e.preventDefault();
            const editId = document.getElementById('spp-edit-id').value;

                document.getElementById('realisasi-tgl').value = today;

        function saveRealisasi(e) {
            e.preventDefault();
            const id = document.getElementById('realisasi-spp-id').value;
            const histIndex = document.getElementById('realisasi-index').value;
            const tgl = document.getElementById('realisasi-tgl').value;
            const qty = parseFloat(document.getElementById('realisasi-qty').value);

            const spp = sppData.find(i => i.id == id);
            if(spp) {
                if (histIndex !== "") {
                    const oldQty = spp.realisasiHistory[histIndex].qty;
                    spp.realisasiHistory[histIndex] = { tgl, qty };
                    spp.totalRealisasi = spp.totalRealisasi - oldQty + qty;
                } else {
                    spp.realisasiHistory.push({ tgl, qty });
                    spp.totalRealisasi += qty;
                }
            }

            closeModal('modal-realisasi');
            saveData();
        }

                if(spp && spp.realisasiHistory[histIndex]) {

        function renderStokTableAndDashboard() {
            const itemsMap = {};

            masukData.forEach(m => {
                if(!itemsMap[m.barang]) {
                    itemsMap[m.barang] = { barang: m.barang, spek: m.spek, satuan: m.satuan, masuk: 0, keluar: 0, tglUpdate: m.tgl };
                }
                itemsMap[m.barang].masuk += m.qty;
                if(m.tgl > itemsMap[m.barang].tglUpdate) itemsMap[m.barang].tglUpdate = m.tgl;
            });

            keluarData.forEach(k => {
                if(!itemsMap[k.barang]) {
                    itemsMap[k.barang] = { barang: k.barang, spek: k.spek || '-', satuan: k.satuan, masuk: 0, keluar: 0, tglUpdate: k.tgl };
                }
                itemsMap[k.barang].keluar += k.qty;
                if(k.tgl > itemsMap[k.barang].tglUpdate) itemsMap[k.barang].tglUpdate = k.tgl;
            });

            const stokBody = document.getElementById('stok-table-body');
            stokBody.innerHTML = '';

            let totalSaldoStokAll = 0;
            let stokList = Object.values(itemsMap);

            stokList.forEach((item, idx) => {
                const saldo = item.masuk - item.keluar;
                totalSaldoStokAll += saldo;

                stokBody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-100">
                        <td class="p-3 pl-5 text-slate-400 font-semibold">${idx + 1}</td>
                        <td class="p-3 text-slate-500">${item.tglUpdate}</td>
                        <td class="p-3 font-bold text-slate-800">${item.barang}</td>
                        <td class="p-3 text-slate-500">${item.spek}</td>
                        <td class="p-3 text-slate-500">${item.satuan}</td>
                        <td class="p-3 text-center font-bold text-emerald-600">+${item.masuk}</td>
                        <td class="p-3 text-center font-bold text-rose-500">-${item.keluar}</td>
                        <td class="p-3 text-center font-bold text-purple-600">${saldo}</td>
                        <td class="p-3 text-slate-400 italic text-[11px]">Terhubung Stok</td>
                    </tr>
                `;
            });

            const totalSppQty = sppData.reduce((a, b) => a + b.qty, 0);
            const totalRealisasiQty = sppData.reduce((a, b) => a + b.totalRealisasi, 0);
            const totalKurangQty = Math.max(0, totalSppQty - totalRealisasiQty);

            const totalMasukQty = masukData.reduce((a, b) => a + b.qty, 0);
            const totalMasukRp = masukData.reduce((a, b) => a + b.total, 0);

            document.getElementById('dash-total-spp').innerHTML = `${totalSppQty} <span class="text-sm font-normal text-slate-500">Qty</span>`;
            document.getElementById('dash-spp-count').innerText = `${sppData.length} SPP terdaftar \u2192`;
            document.getElementById('dash-total-kurang').innerHTML = `${totalKurangQty} <span class="text-sm font-normal text-slate-500">Qty</span>`;
            document.getElementById('dash-total-masuk').innerHTML = `${totalMasukQty} <span class="text-sm font-normal text-slate-500">Qty</span>`;
            document.getElementById('dash-val-masuk').innerText = `Rp ${totalMasukRp.toLocaleString('id-ID')} \u2192`;
            document.getElementById('dash-total-jenis').innerHTML = `${stokList.length} <span class="text-sm font-normal text-slate-500">Jenis</span>`;
            document.getElementById('dash-saldo-total').innerText = `Saldo: ${totalSaldoStokAll} Qty \u2192`;

            const dashTableBody = document.getElementById('dash-table-body');
            dashTableBody.innerHTML = '';
            sppData.forEach((item, idx) => {
                const sisa = item.qty - item.totalRealisasi;
                const statusBadge = sisa <= 0 
                    ? `<span class="bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded text-[10px]">LUNAS</span>`
                    : `<span class="bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded text-[10px]">KURANG</span>`;

                dashTableBody.innerHTML += `
                    <tr class="hover:bg-slate-50 border-b border-slate-100">
                        <td class="p-3 pl-5 text-slate-400 font-semibold">${idx + 1}</td>
                        <td class="p-3 font-semibold text-blue-600">${item.no}</td>
                        <td class="p-3 text-slate-500">${item.tgl}</td>
                        <td class="p-3 font-medium text-slate-700">${item.pengaju || '-'}</td>
                        <td class="p-3 font-bold text-slate-800">${item.barang}</td>
                        <td class="p-3 text-slate-500">${item.spek}</td>
                        <td class="p-3 text-center text-slate-700">${item.qty} ${item.satuan}</td>
                        <td class="p-3 text-center text-slate-700">${item.totalRealisasi} ${item.satuan}</td>
                        <td class="p-3 text-center font-bold text-amber-600">${sisa} ${item.satuan}</td>
                        <td class="p-3 text-center">${statusBadge}</td>
                    </tr>
                `;
            });

            renderCharts();
        }

        function renderCharts() {
            const sppBarang = sppData.map(i => i.barang);
            const sppPermintaan = sppData.map(i => i.qty);
            const sppRealisasi = sppData.map(i => i.totalRealisasi);

            if(barChartInstance) barChartInstance.destroy();
            const ctxBar = document.getElementById('barChart').getContext('2d');
            barChartInstance = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: sppBarang,
                    datasets: [
                        { label: 'Permintaan SPP', data: sppPermintaan, backgroundColor: '#3b82f6', borderRadius: 4 },
                        { label: 'Terealisasi', data: sppRealisasi, backgroundColor: '#10b981', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'top', labels: { boxWidth: 12, font: { size: 10 } } } },
                    scales: { y: { beginAtZero: true, grid: { color: '#f3f4f6' } }, x: { grid: { display: false } } }
                }
            });

            const masukMap = {};
            masukData.forEach(m => { masukMap[m.barang] = (masukMap[m.barang] || 0) + m.qty; });

            if(pieChartInstance) pieChartInstance.destroy();
            const ctxPie = document.getElementById('pieChart').getContext('2d');
            pieChartInstance = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(masukMap),
                    datasets: [{
                        data: Object.values(masukMap),
                        backgroundColor: ['#06b6d4', '#f59e0b', '#a855f7', '#ec4899', '#3b82f6']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } }
                }
            });
        }

        window.onload = () => { 
            renderAll(); 
            loadDataFromServer(); 
        };
       // Fungsi Export Data ke Excel (.xlsx)
    function exportDataExcel() {
        try {
            let sppData = JSON.parse(localStorage.getItem('spp_data')) || [];
            let barangMasukData = JSON.parse(localStorage.getItem('barang_masuk_data')) || [];
            let stokBarangData = JSON.parse(localStorage.getItem('stok_barang_data')) || [];

            if(sppData.length === 0) sppData = [{ Keterangan: "Belum ada data SPP" }];
            if(barangMasukData.length === 0) barangMasukData = [{ Keterangan: "Belum ada data Barang Masuk" }];
            if(stokBarangData.length === 0) stokBarangData = [{ Keterangan: "Belum ada data Stok" }];

            let wb = XLSX.utils.book_new();
            let wsSPP = XLSX.utils.json_to_sheet(sppData);
            let wsBarangMasuk = XLSX.utils.json_to_sheet(barangMasukData);
            let wsStok = XLSX.utils.json_to_sheet(stokBarangData);

            XLSX.utils.book_append_sheet(wb, wsSPP, "SPP & Realisasi");
            XLSX.utils.book_append_sheet(wb, wsBarangMasuk, "Barang Masuk");
            XLSX.utils.book_append_sheet(wb, wsStok, "Stok Barang");

            XLSX.writeFile(wb, "LogistikPro_Data.xlsx");
            alert("Data berhasil diexport ke file LogistikPro_Data.xlsx");
        } catch (error) {
            console.error(error);
            alert("Gagal mengexport data.");
        }
    }

       // Fungsi Import Data dari Excel (.xlsx, .xls, .csv)
    function importDataExcel(event) {
        let file = event.target.files[0];
        if (!file) return;

        let reader = new FileReader();
        reader.onload = function(e) {
            try {
                let data = new Uint8Array(e.target.result);
                let workbook = XLSX.read(data, { type: 'array' });
                let firstSheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[firstSheetName];
                let jsonhasil = XLSX.utils.sheet_to_json(worksheet);

                if(jsonhasil.length > 0) {
                    localStorage.setItem('spp_data', JSON.stringify(jsonhasil));
                    alert("Data Excel berhasil diimport! Halaman akan dimuat ulang.");
                    location.reload();
                } else {
                    alert("File Excel kosong atau format tidak sesuai.");
                }
            } catch (error) {
                console.error(error);
                alert("Terjadi kesalahan saat membaca file Excel.");
            }
        };
        reader.readAsArrayBuffer(file);
    }
